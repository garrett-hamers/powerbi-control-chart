name: Quality and certification readiness

on:
  push:
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run eslint
      - run: npm run audit
      - run: npm run certification-audit
      - run: npm run package
      - run: npm run source-parity-audit
      - run: npm run release-manifest
